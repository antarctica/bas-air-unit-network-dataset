[project]
name = "bas-air-unit-network-dataset"
version = "0.5.1"
description = "Utility to process routes and waypoints used by the British Antarctic Survey (BAS) Air Unit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Felix Fennell", email = "felnne@bas.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "Fiona>=1.10.1,<2.0.0",
    "Shapely>=2.0.6,<3.0.0",
    "geojson>=3.3.0",
    "gpxpy>=1.6.2,<2.0.0",
    "importlib-resources>=7.1.0,<8.0.0",
    "jinja2>=3.1.4,<4.0.0",
    "lxml>=6.1.0,<7.0.0",
    "python-slugify>=9.1.0,<10.0.0",
    "ulid-py>=1.1.0,<2.0.0",
    "weasyprint>=70.0,<71.0",
]

[project.urls]
Homepage = "https://github.com/antarctica/bas-air-unit-network-dataset"
Repository = "https://github.com/antarctica/bas-air-unit-network-dataset"

[dependency-groups]
dev = [
    "dunamai>=1.26.5",
    "ruff>=0.17.5",
    "taskipy>=1.14.1",
    "ty>=0.0.105",
    "types-lxml>=2026.2.16",
]

[tool.uv.exclude-newer-package]
# intentionally empty

[[tool.uv.index]]
name = "self"
url = "https://gitlab.data.bas.ac.uk/api/v4/projects/984/packages/pypi/simple"
publish-url = "https://gitlab.data.bas.ac.uk/api/v4/projects/984/packages/pypi"
explicit = true

[tool.taskipy.variables]
# TODO: docs_targets = "docs/ README.md CHANGELOG.md"
types_targets = "src/"
targets = "src/ tests/"

[tool.taskipy.tasks]
# generic dev
build = { cmd = "uv build", help = "Build app package" }
format = { cmd = "ruff format {targets}", help = "Format app", use_vars = true }
lint = { cmd = "ruff check {targets}", help = "Lint app", use_vars = true }
types = { cmd = "ty check {types_targets}", help = "Type check app", use_vars = true }
prek = { cmd = "prek run --all-files", help = "Run pre-hooks hooks on all files using Prek" }
audit = { cmd = "uv audit --frozen", help = "Check for insecure dependencies" }
outdated = { cmd = "uv tree --all-groups --outdated --depth=1", help = "List outdated directed dependencies" }
# app dev
release = { cmd = "python -m tasks.release", help = "Prepapre app release" }
version = { cmd = "uv version", help = "Show app version" }
test-outputs = { cmd = "echo '!! run `uv run python tests/create_outputs.py` (taskipy cannot load PDF libs)'", help = "Generate outputs for test network" }
test-compare = { cmd = "python tests/compare_outputs.py", help = "Compare generated outputs against known test references." }

[tool.ruff]
src = ["src"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
#    A | builtins (variables named after builtin names)
#  ANN | annotations (type hints)
#    B | bug-bear (bad code)
#   B9 | bug-bear opinionated (additional bad code)
#  BLE | blind except
#  C90 | mccabe (code complexity)
#   C4 | comprehensions (list/dict/set comprehensions)
#  COM | commas (for diffs)
#    D | pydocstyle (docstring)
#  DTZ | datetimez (date/time)
#    E | pycodestyle errors (PEP8)
#   EM | errmsg (exceptions)
#  ERA | eraticate (comments)
#    F | pyflakes (invalid/bad code)
#   FA | future-annotations (type hints)
# FURB | refurb
#    I | isort (import ordering)
#  INT | flake8-gettext
#  ISC | implicit-str-concat
#    G | logging-format
#  LOG | logging
#    N | pep8-naming (PEP8)
# PERF | performance
#  PIE | misc rules
#   PL | pylint
#   PT | pytest-style (tests)
#  PTH | use-pathlib (old syntax)
#  PYI | type hints
#  RET | return (return statements)
#  RUF | ruff (other)
#    S | bandit (static security)
#  SIM | simplicity (code complexity)
#   TC | type-checking
#   TD | todos (comments)
#  TID | tidy-imports
#  TRY | tryceratops (exceptions)
#   UP | pyupgrade (old syntax)
#    W | pycodestyle warnings (PEP8)
#  YTT | flake8-2020 (sys.version)
select = ["A", "ANN", "B", "B9", "BLE", "C90", "C4", "COM", "D", "DTZ", "E", "EM", "ERA", "F", "FA", "FURB", "I", "INT", "ISC", "G", "LOG", "N", "PERF", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RUF", "S", "SIM", "TC", "TD", "TID", "TRY", "UP", "W", "YTT"]

#     COM812 | missing trailing comma (will force verbose function signatures/calls)
#       D100 | for avoiding module level docstrings
#       D104 | for avoiding package level docstrings
#       D203 | for requiring blank line before classes (which looks silly)
#       D212 | for docstring requiring multi-line comments to start on first line (which looks silly)
#       D401 | for requiring imperative mood in docstrings (finally had enough, too annoying)
#       D402 | for docstring that can't resemble their signatures (despite them being completely different)
#       D413 | for requiring a blankline in docstrings if a section is used (which looks silly)
#       E501 | for bug-bear compatibility (as B905 overrides line length checks)
#  PL(R)0913 | too many arguments
#  PL(R)0917 | too many positional arguments
#      PT001 | for `@pytest.fixture` parentheses (as it's unstable/unreliable)
#      PT023 | for `@pytest.mark.cov` parentheses (as it's unstable/unreliable)
#     PYI019 | for using custom types instead of Self (as it breaks cattras structure methods)
#       S607 | for using non-absolute executable paths in Subprocess (as it breaks portability)
#      TD002 | for TODOs without an author (as an issue should assign ownership)
ignore = [
    "COM812", "D100", "D104", "D107", "D203", "D212", "D401", "D402", "E501", "PLR0913", "PLR0917", "PT001", "PT023", "PYI019", "S607", "TD002", "D413",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-unused-arguments]
# Ignore unused variadic argument, like *args and **kwargs.
ignore-variadic-names = true


[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
